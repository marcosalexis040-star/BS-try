<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BS-try — Shelly Arena</title>
<link rel="icon" href="data:,">

<style>
  :root { --bg:#12131a; --panel:#1c1e29; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:
      radial-gradient(1200px 600px at 50% -10%, #232538, #0d0e14 60%);
      color:#e8e9f0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:12px; padding:12px; }
  h1 { margin:0; font-size:clamp(16px,2.4vw,24px); letter-spacing:.5px; font-weight:800; }
  h1 span { color:#e8428c; }
  #hint { margin:0; font-size:13px; opacity:.7; }
  #stage { position:relative; box-shadow:0 20px 60px rgba(0,0,0,.5);
      border-radius:14px; overflow:hidden; border:1px solid #2c2f40; }
  canvas { display:block; background:#2f7d43; touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px; text-align:center;
      background:rgba(10,11,16,.72); backdrop-filter:blur(3px); }
  #overlay.hidden { display:none; }
  #overlay h2 { margin:0; font-size:clamp(22px,4vw,40px); }
  #overlay p { margin:0; max-width:420px; opacity:.85; line-height:1.5; }
  button { cursor:pointer; border:none; border-radius:10px; padding:12px 26px;
      font-size:16px; font-weight:700; color:#fff;
      background:linear-gradient(180deg,#f0559a,#d5327d); box-shadow:0 6px 18px rgba(213,50,125,.45); }
  button:active { transform:translateY(1px); }
  .kbd { display:inline-block; padding:2px 8px; border-radius:6px; background:#2c2f40;
      border:1px solid #3a3e52; font-family:ui-monospace,monospace; font-size:13px; }
</style>
</head>
<body>
  <div id="wrap">
    <h1>BS&#8209;try · <span>Shelly</span> Arena</h1>
    <div id="stage">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="overlay">
        <h2>Shelly Arena</h2>
        <p>Muévete con <span class="kbd">WASD</span> / <span class="kbd">flechas</span>,
           apunta con el <b>ratón</b> y dispara la escopeta con <b>clic</b> o
           <span class="kbd">espacio</span>. Sobrevive y elimina enemigos.</p>
        <button id="startBtn">Jugar</button>
      </div>
    </div>
    <p id="hint">Los sprites de Shelly se cargan desde <code>assets/shelly.png</code></p>
  </div>
  <script src="game.js"></script>
</body>
</html>
